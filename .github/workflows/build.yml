name: Build iStoreOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3.12-distutils rsync unzip zlib1g-dev file wget


      - name: Verify .config exists
        run: |
          if [ ! -f .config ]; then
            echo "❌ ERROR: .config not found in repo root"
            exit 1
          fi
          echo "Found .config"

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Config
        run: |
          cp .config .config.backup
          make defconfig

      - name: Download Sources
        run: |
          make download -j8

      - name: Build Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-firmware
          path: bin/targets
