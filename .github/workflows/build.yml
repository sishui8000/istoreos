name: Build iStoreOS for JDCloud AX1800 Pro (Arthur, IPQ60xx with NSS + Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 4096
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean working directory
      run: |
        sudo rm -rf ./*

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        build-essential ccache ecj fastjar file g++ gawk gcc-multilib \
        genisoimage gettext git java-propose-classpath libelf-dev \
        libncurses5-dev libncursesw5-dev libssl-dev python3 \
        python3-pyelftools qemu-utils subversion swig time xsltproc \
        zlib1g-dev curl wget

    - name: Clone iStoreOS source
      run: |
        git clone --depth 1 https://github.com/iStoreOS/istoreos.git .
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy user config
      run: |
        cp $GITHUB_WORKSPACE/.config .config
        make defconfig

    - name: Build firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: JDCloud-AX1800Pro-NSS-Docker
        path: bin/
