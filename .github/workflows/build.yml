name: Build iStoreOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4


      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          build-essential ccache ecj fastjar file g++ gawk gcc-multilib \
          genisoimage gettext git java-propose-classpath libelf-dev \
          libncurses5-dev libncursesw5-dev libssl-dev python3 \
          python3-pyelftools qemu-utils subversion swig time xsltproc \
          zlib1g-dev curl wget

      - name: Verify .config exists
        run: |
          if [ ! -f .config ]; then
            echo "❌ ERROR: .config not found in repo root"
            exit 1
          fi
          echo "Found .config"

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Config
        run: |
          cp .config .config.backup
          make defconfig

      - name: Download Sources
        run: |
          make download -j8

      - name: Build Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-firmware
          path: bin/targets
